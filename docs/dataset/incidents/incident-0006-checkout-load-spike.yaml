remediation: 'The spike subsided on its own when the load stopped. Durable fix: a read cache
  / CDN in front of catalogue, request rate-limiting at the BFF, and horizontal headroom (autoscaling)
  so a traffic surge degrades gracefully instead of sliding into saturation.

  '
