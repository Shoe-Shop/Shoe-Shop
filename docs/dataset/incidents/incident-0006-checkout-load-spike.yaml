  \ the read path \u2014 BFF to Catalogue to Postgres/Meilisearch \u2014 to elevated request\
  \ latency. Every service stayed up; the symptom is degraded RED duration and a request-rate\
  \ spike, the early warning before a saturation failure rather than the failure itself.\n"
