# Shoe Shop — FULL profile overlay.
# Used as: compose.yaml + compose.core.yaml + compose.full.yaml
# Adds the remaining 4 stub services + Zitadel auth (total 11 services).
# (Users moved to compose.core.yaml — it's a real, MELT-complete service that
# depends only on the always-on base, so the four real services validate on core.)

x-stub: &stub
  image: traefik/whoami:${WHOAMI_TAG:-v1.10.2}
  restart: "no"
  networks: [shoeshop]

services:
  # ── Shipping — Kotlin · Ktor (Postgres + NATS) ───────────────────
  shipping:
    <<: *stub
    # build: { context: ../../services/shipping }
    container_name: shoeshop-shipping
    environment:
      OTEL_SERVICE_NAME: shipping
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shoeshop,deployment.environment=local
    ports:
      - "${SHIPPING_PORT:-9007}:80"
    depends_on:
      postgres: { condition: service_started }
      nats: { condition: service_started }
      otel-lgtm: { condition: service_started }
    mem_limit: 384m

  # ── Inventory — Go · gRPC (Postgres + NATS) ──────────────────────
  # MOVED to compose.checkout.yaml (the v0.3 write-path overlay) alongside Orders,
  # so the whole checkout set is one coherent, opt-in unit. `task up:full` folds in
  # the checkout overlay, so Inventory is still part of "all services".

  # ── Recommendation — Python · FastAPI + ONNX Runtime ─────────────
  recommendation:
    <<: *stub
    # build: { context: ../../services/recommendation }
    container_name: shoeshop-recommendation
    environment:
      OTEL_SERVICE_NAME: recommendation
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shoeshop,deployment.environment=local
    ports:
      - "${RECOMMENDATION_PORT:-9009}:80"
    depends_on:
      postgres: { condition: service_started }
      otel-lgtm: { condition: service_started }
    mem_limit: 320m

  # ── Notification — Go · NATS subscriber (stateless) ──────────────
  # MOVED to compose.checkout.yaml (the v0.3 write-path overlay) alongside Orders/
  # Inventory/Payment — it subscribes to the saga's terminal ORDERS events
  # (orders.confirmed/orders.cancelled), so it belongs with the write path.
  # `task up:full` folds in the checkout overlay, so Notification is still part of
  # "all services". (Kept out of full to avoid the compose-merge gotcha: a stub here
  # would self-conflict with the real build and append to its ports list.)

  # ── Zitadel — OIDC auth provider (Go, ~200MB). Manages its own
  #    database + role via start-from-init against shared Postgres. ──
  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_TAG:-latest}
    container_name: shoeshop-zitadel
    restart: "no"
    command: 'start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}" --tlsMode disabled'
    environment:
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${ZITADEL_PORT:-8080}
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-postgres}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
    ports:
      - "${ZITADEL_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 384m
    networks: [shoeshop]
