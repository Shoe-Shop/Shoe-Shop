# Shoe Shop — CORE profile overlay (merged on top of compose.yaml).
# The default daily profile: the MELT-complete READ path — frontend, bff,
# catalogue, cart, users (all real) — plus the Payment stub. The v0.3 WRITE path
# (real Orders + Inventory over NATS) is the opt-in checkout overlay
# (compose.checkout.yaml, `task up:checkout`), so core stays lean (~0.9 GB).
#
# Each service currently runs a `traefik/whoami` STUB so the topology, ports,
# memory limits, and dependency graph are real and runnable today. When a
# service's code lands (v0.2+), delete the `image:` line and uncomment the
# matching `build:` block — nothing else changes.

x-stub: &stub
  image: traefik/whoami:${WHOAMI_TAG:-v1.10.2}
  restart: "no"
  networks: [shoeshop]

services:
  # ── Frontend — TypeScript · Next.js 15 (NEXUS storefront) ───────────────────
  # Real service (v0.2). Next.js 15 App Router; reads catalogue/cart/search via
  # the BFF. OTel is bootstrapped via src/instrumentation.ts (register() hook)
  # with NodeSDK → OTLP/gRPC. gRPC packages are marked serverExternalPackages
  # in next.config.ts so webpack does not try to bundle them. Build context is
  # services/frontend (no repo-root proto dependency needed).
  frontend:
    build:
      context: ../../services/frontend
    image: shoeshop/frontend:dev
    restart: "no"
    networks: [shoeshop]
    container_name: shoeshop-frontend
    environment:
      OTEL_SERVICE_NAME: frontend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shoeshop,deployment.environment=local
      # Trim resource detectors to env-only — keeps host.*/process.* off
      # Loki/Prometheus labels, matching the other JS/TS services (BFF, Cart).
      OTEL_NODE_RESOURCE_DETECTORS: env
      # Disable Next.js anonymous usage telemetry inside the container.
      NEXT_TELEMETRY_DISABLED: "1"
      # BFF reachability: server components use the internal Docker hostname;
      # browser code uses the published host port (via NEXT_PUBLIC_*).
      BFF_INTERNAL_URL: http://bff:8080
      NEXT_PUBLIC_BFF_URL: http://localhost:${BFF_PORT:-9001}
    ports:
      - "${FRONTEND_PORT:-9000}:3000"
    depends_on:
      bff: { condition: service_started }
      otel-lgtm: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m

  # ── BFF — TypeScript · Hono (trace root) ─────────────────────────
  # Real service (v0.2). Fronts Catalogue over gRPC; will aggregate more
  # services as they become real. Build context is the repo root (the runtime
  # gRPC client loads the Catalogue .proto). See services/bff/Dockerfile.
  bff:
    build:
      context: ../../
      dockerfile: services/bff/Dockerfile
    image: shoeshop/bff:dev
    restart: "no"
    networks: [shoeshop]
    container_name: shoeshop-bff
    environment:
      OTEL_SERVICE_NAME: bff
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shoeshop,deployment.environment=local
      # Trim NodeSDK resource detectors to env-only so bff's resource matches the
      # Go/Python services (service.name/namespace, deployment.environment,
      # telemetry.sdk.*) — keeps host.*/process.* off Loki/Prometheus labels.
      OTEL_NODE_RESOURCE_DETECTORS: env
      PORT: "8080"
      CATALOGUE_ADDR: "catalogue:9090"
      CART_ADDR: "cart:9090"
      USERS_ADDR: "users:9090"
      # Orders is real only under the checkout overlay; the client connects lazily,
      # so this default is harmless on plain `core` (checkout routes return 503 then).
      ORDERS_ADDR: "orders:9090"
    ports:
      - "${BFF_PORT:-9001}:8080"
    depends_on:
      catalogue: { condition: service_healthy }
      cart: { condition: service_healthy }
      users: { condition: service_healthy }
      otel-lgtm: { condition: service_started }
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 192m

  # ── Catalogue — Go · gRPC (Postgres + Meilisearch) ───────────────
  # First real service (v0.2). Build context is the repo root so the generated
  # proto module is in scope; see services/catalogue/Dockerfile.
  catalogue:
    build:
      context: ../../
      dockerfile: services/catalogue/Dockerfile
    image: shoeshop/catalogue:dev
    restart: "no"
    networks: [shoeshop]
    container_name: shoeshop-catalogue
    environment:
      OTEL_SERVICE_NAME: catalogue
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shoeshop,deployment.environment=local
      CATALOGUE_GRPC_ADDR: ":9090"
      CATALOGUE_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/catalogue?sslmode=disable"
      MEILI_URL: "http://meilisearch:7700"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-shoeshop-dev-master-key}"
    ports:
      - "${CATALOGUE_PORT:-9002}:9090"
    depends_on:
      postgres: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
      otel-lgtm: { condition: service_started }
    healthcheck:
      test: ["CMD", "/grpc-health-probe", "-addr=127.0.0.1:9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 160m

  # ── Cart — Node.js · gRPC (Redis) ────────────────────────────────
  # Real service (v0.2). gRPC API backed by Redis; build context is the repo
  # root (the runtime gRPC server loads the Cart .proto). See services/cart.
  cart:
    build:
      context: ../../
      dockerfile: services/cart/Dockerfile
    image: shoeshop/cart:dev
    restart: "no"
    networks: [shoeshop]
    container_name: shoeshop-cart
    environment:
      OTEL_SERVICE_NAME: cart
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shoeshop,deployment.environment=local
      # Trim NodeSDK resource detectors to env-only so cart's resource matches the
      # Go/Python services (service.name/namespace, deployment.environment,
      # telemetry.sdk.*) — keeps host.*/process.* off Loki/Prometheus labels.
      OTEL_NODE_RESOURCE_DETECTORS: env
      CART_GRPC_ADDR: "0.0.0.0:9090"
      HEALTH_PORT: "8080"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "${CART_PORT:-9003}:9090"
    depends_on:
      redis: { condition: service_healthy }
      otel-lgtm: { condition: service_started }
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 192m

  # ── Users — Python · FastAPI · gRPC (Postgres) ───────────────────
  # Real service (v0.2, MELT-complete). gRPC API backed by Postgres
  # (database-per-service); FastAPI serves /healthz + /readyz. Build context is
  # the repo root so the committed Python gRPC stubs are in scope. Depends only
  # on postgres + otel-lgtm (both in the always-on base), so it lives in `core`
  # and the four real MELT services validate together on the default profile.
  # See services/users/Dockerfile.
  users:
    build:
      context: ../../
      dockerfile: services/users/Dockerfile
    image: shoeshop/users:dev
    restart: "no"
    networks: [shoeshop]
    container_name: shoeshop-users
    environment:
      OTEL_SERVICE_NAME: users
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shoeshop,deployment.environment=local
      USERS_GRPC_ADDR: "0.0.0.0:9090"
      USERS_HEALTH_PORT: "8080"
      USERS_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/users"
    ports:
      - "${USERS_PORT:-9006}:9090"
    depends_on:
      postgres: { condition: service_healthy }
      otel-lgtm: { condition: service_started }
    healthcheck:
      # IPv4 (127.0.0.1) not "localhost" (ADR-0001 #10). FastAPI liveness probe.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m

  # ── Orders — Java 21 · Spring Boot (Postgres + NATS) ─────────────
  # The real Orders service is the v0.3 checkout-saga orchestrator and lives in
  # the checkout overlay (compose.checkout.yaml) with the rest of the write path,
  # not as a stub here. `task up:checkout` / `up:full` bring it up.

  # ── Payment — Rust · Axum (Postgres) ─────────────────────────────
  payment:
    <<: *stub
    # build: { context: ../../services/payment }
    container_name: shoeshop-payment
    environment:
      OTEL_SERVICE_NAME: payment
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shoeshop,deployment.environment=local
    ports:
      - "${PAYMENT_PORT:-9005}:80"
    depends_on:
      postgres: { condition: service_started }
      otel-lgtm: { condition: service_started }
    mem_limit: 96m
