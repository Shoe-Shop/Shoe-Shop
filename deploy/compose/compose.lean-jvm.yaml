# Shoe Shop — LEAN-JVM overlay.
# Used as: compose.yaml + compose.core.yaml + compose.full.yaml + compose.lean-jvm.yaml
# Squeezes the two JVM services (Orders, Shipping) for the tightest RAM budget.
# JAVA_TOOL_OPTIONS is honored by the real Spring Boot / Ktor images; the
# current whoami stubs simply ignore it.

services:
  orders:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:MaxRAMPercentage=75"
    mem_limit: 256m

  shipping:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:MaxRAMPercentage=75"
    mem_limit: 256m
